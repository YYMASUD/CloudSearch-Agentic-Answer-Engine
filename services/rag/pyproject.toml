[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudsearch-rag"
version = "0.1.0"
description = "CloudSearch RAG / Grounding & Ranking Layer"
requires-python = ">=3.12"
dependencies = [
    "cloudsearch-shared",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.1",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    # Document parsing
    "pymupdf>=1.25.1",
    "python-docx>=1.1.2",
    "beautifulsoup4>=4.13.0",
    "lxml>=5.3.0",
    # Embeddings + ML
    "sentence-transformers>=3.3.1",
    "numpy>=1.26.4",
    "scikit-learn>=1.6.0",
    # Vector store
    "qdrant-client[fastembed]>=1.13.1",
    # Re-ranking
    "transformers>=4.47.1",
    "torch>=2.5.1",
    # Text processing
    "nltk>=3.9.1",
    "rank-bm25>=0.2.2",
    # Async
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.2.1",
    "aiokafka>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
]

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
