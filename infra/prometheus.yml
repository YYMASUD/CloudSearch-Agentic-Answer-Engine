global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "gateway"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: "/metrics"

  - job_name: "orchestrator"
    static_configs:
      - targets: ["host.docker.internal:8001"]
    metrics_path: "/metrics"

  - job_name: "rag"
    static_configs:
      - targets: ["host.docker.internal:8002"]
    metrics_path: "/metrics"

  - job_name: "llm"
    static_configs:
      - targets: ["host.docker.internal:8003"]
    metrics_path: "/metrics"

  - job_name: "meilisearch"
    static_configs:
      - targets: ["meilisearch:7700"]
    metrics_path: "/metrics"

  - job_name: "qdrant"
    static_configs:
      - targets: ["qdrant:6333"]
    metrics_path: "/metrics"

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
