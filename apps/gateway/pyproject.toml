[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudsearch-gateway"
version = "0.1.0"
description = "CloudSearch API Gateway — REST + SSE + GraphQL"
requires-python = ">=3.12"
dependencies = [
    "cloudsearch-shared",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.1",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "strawberry-graphql[fastapi]>=0.257.0",
    "redis[hiredis]>=5.2.1",
    "aiokafka>=0.12.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["gateway"]
