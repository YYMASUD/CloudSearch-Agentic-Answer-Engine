[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudsearch-tests"
version = "0.1.0"
description = "CloudSearch test suite"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "httpx>=0.28.1",
    "cloudsearch-shared",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["unit", "integration"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
